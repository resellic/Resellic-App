name: Build Resellic App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q resellic-client-app.zip -d proj

      - name: Firebase config
        run: cp google-services.json proj/app/ 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: proj
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: proj
        run: |
          { echo '```'; grep -E "^e: |What went wrong" -A2 build.log | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/*.apk out/Resellic-App.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Resellic-App
          path: out/Resellic-App.apk
